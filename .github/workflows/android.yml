name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the APK as a release asset

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Locate debug APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No debug APK was produced" >&2
            exit 1
          fi
          echo "Found $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # Release assets do not count against the Actions artifact storage quota.
      - name: Publish APK to the debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" CallStudio-debug.apk
          TAG=debug-latest
          NOTES="Debug build from commit ${GITHUB_SHA::7}. Not signed for the Play Store."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "CallStudio debug build (latest)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" CallStudio-debug.apk --clobber

      # Optional copy as a workflow artifact. Free accounts have a small storage quota, so a failure here is ignored.
      - name: Upload debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CallStudio-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload test reports (only when something failed)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CallStudio-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
